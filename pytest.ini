[pytest]
addopts = --alluredir=.tmp/allure-results --clean-alluredir
testpaths = tests
pythonpath = .
markers =
    smoke: read-only smoke проверки стенда (M1)
    api: проверки контрактов Medusa API (M1)
    seo: индексация и SEO-атрибуты витрины (canonical/hreflang/robots), гигиена стенда
    catalog: листинг каталога, поиск и sitemap на стенде (M1)
    e2e: браузерные пользовательские сценарии Playwright на витрине (M2)
    scenario: сценарные проверки бэкенда с реальными шагами (корзина -> заказ) (M3)
    checkout: сценарии оформления заказа
    unit: офлайн-проверки самого QA-репозитория, без сети
    tcms: интеграция с Kiwi TCMS по JSON-RPC
