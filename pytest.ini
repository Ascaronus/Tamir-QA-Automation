[pytest]
addopts = --alluredir=.tmp/allure-results --clean-alluredir
testpaths = tests
pythonpath = .
markers =
    smoke: read-only smoke проверки стенда (M1)
    api: проверки контрактов Medusa API (M1)
    e2e: браузерные сценарии Playwright (появятся в M2)
    unit: офлайн-проверки самого QA-репозитория, без сети
    tcms: интеграция с Kiwi TCMS по XML-RPC (M2)
