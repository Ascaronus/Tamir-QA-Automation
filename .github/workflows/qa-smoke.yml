name: QA smoke (staging)

# Прод не трогается: тесты ходят только на staging-цели из docs/ENVIRONMENTS.md,
# а guard в qa/config.py не пустит запросы на tamir.rs / www.tamir.rs / api.tamir.rs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      headed:
        description: "Браузер с интерфейсом (актуально для e2e в M2)"
        type: boolean
        default: false
  schedule:
    # Ночной прогон на буднях
    - cron: "0 5 * * 1-5"

permissions:
  contents: read

# Один прогон на ветку/PR, но по очереди, а не отменой. Отменять прогон стенда
# нельзя: каждый из них публикует Allure-отчёт на qa.tamir.rs и пишет результаты
# в Kiwi TCMS. Практика показала обратное — при серии слияний Dependabot из
# шести пушей четыре прогона на main были отменены, и в отчётности появились
# дырки (PR #1-#10, 2026-11-23). Runner один (tamir-qa), поэтому очередь из
# прогонов по ~90 с безопаснее, чем потерянные прогоны.
concurrency:
  group: qa-smoke-${{ github.ref_name }}
  cancel-in-progress: false

# Версии действий берутся только теми, что уже отработали на этом раннере:
# major-тега у части экшенов нет (setup-uv@v10 → "unable to find version"), а
# обновляются они через Dependabot (.github/dependabot.yml), а не ручным
# переписыванием в main.

jobs:
  # Проверка для pull_request (в т.ч. Dependabot): только офлайн-unit-тесты, на
  # GitHub-hosted раннере, без сети, без секретов и без доступа к стенду. Это
  # тот статус-чек, который требует защита ветки перед auto-merge.
  qa-unit:
    name: Офлайн unit-проверка (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Установка uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Установка зависимостей и запуск unit-тестов
        run: |
          set -euo pipefail
          uv venv --python 3.12
          uv pip install -r requirements.txt
          .venv/bin/pytest -m unit --junitxml=.tmp/junit.xml

  qa-smoke:
    name: Прогон unit + smoke + api (self-hosted runner на staging)
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, tamir-qa]
    env:
      # Значения — только в GitHub Actions secrets; здесь лишь имена переменных.
      MEDUSA_PUBLISHABLE_API_KEY: ${{ secrets.MEDUSA_PUBLISHABLE_API_KEY }}
      # Kiwi TCMS: сервисная учётка; её логин и пароль — в секретах репозитория.
      TCMS_URL: ${{ secrets.TCMS_URL }}
      TCMS_USER: ${{ secrets.TCMS_USER }}
      TCMS_PASSWORD: ${{ secrets.TCMS_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Установка uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Установка зависимостей через uv
        run: |
          set -euo pipefail
          # .venv в каталоге прогона; интерпретатор — системный Python 3.12 стенда.
          uv venv --python 3.12
          uv pip install -r requirements.txt
          # Нужно для e2e в M2; в M1 браузерные тесты ещё не пишутся.
          .venv/bin/playwright install chromium

      # Один запуск pytest: addopts уже содержит --clean-alluredir, поэтому
      # несколько вызовов подряд стёрли бы результаты предыдущего.
      - name: Запуск проверок
        run: |
          set -euo pipefail
          source .venv/bin/activate
          pytest -m "unit or smoke or api or seo or catalog" --junitxml=.tmp/junit.xml ${{ inputs.headed && '--headed' || '' }}

      # МетADATA отчёта: из чего и где получен прогон. Значений секретов здесь нет.
      - name: Метаданные для Allure
        if: always()
        run: |
          set -euo pipefail
          cat > .tmp/allure-results/environment.properties <<'ENV'
          Wall=staging
          Web=https://test.tamir.rs
          Api=https://test-api.tamir.rs
          Reports=https://qa.tamir.rs
          TCMS=https://tcms.tamir.rs
          Mailpit=http://192.168.1.143:8025 (только из локальной сети)
          Runner=self-hosted tamir-qa
          ENV
          python3 - <<'PY'
          import json
          import os

          run_number = os.environ["GITHUB_RUN_NUMBER"]
          executor = {
              "name": "Tamir QA",
              "type": "github",
              "buildName": f"QA smoke #{run_number}",
              "buildUrl": (
                  f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              ),
              "reportUrl": f"https://qa.tamir.rs/{run_number}/",
          }
          with open(".tmp/allure-results/executor.json", "w", encoding="utf-8") as handle:
              json.dump(executor, handle, ensure_ascii=False, indent=2)
          PY

      - name: Загрузка Allure-результатов
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results
          path: .tmp/allure-results/
          if-no-files-found: warn

      # Каталог Kiwi TCMS приводится в соответствие коду на каждом прогоне main:
      # seeder идемпотентен и ключуется по pytest nodeid (поле `script`).
      # continue-on-error: недоступность TCMS не должна делать красным сам прогон —
      # сбой виден в логе шага, а тесты на стенде прошли.
      - name: Каталог тест-кейсов в Kiwi TCMS
        if: github.ref == 'refs/heads/main' && always()
        continue-on-error: true
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python scripts/tcms_seed.py

      # Результаты пишутся из Allure result-файлов (тот же источник, что и отчёт):
      # TestExecution.create/update + ссылка на будущий отчёт этого прогона.
      - name: Результаты прогона в Kiwi TCMS
        if: github.ref == 'refs/heads/main' && always()
        continue-on-error: true
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python scripts/tcms_sync_results.py \
            --report-url "https://qa.tamir.rs/${GITHUB_RUN_NUMBER}/"

  qa-report:
    name: Сборка Allure-отчёта (GitHub-hosted, там есть Java)
    needs: qa-smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Java 17 (нужна для Allure CLI)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Установка Allure CLI
        run: npm i -g allure-commandline

      - name: Скачивание результатов
        uses: actions/download-artifact@v8
        with:
          name: allure-results
          path: .tmp/allure-results

      - name: Генерация отчёта
        run: allure generate .tmp/allure-results -o .tmp/allure-report --clean

      - name: Загрузка отчёта
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: .tmp/allure-report/

  qa-publish:
    name: Публикация отчёта на qa.tamir.rs
    # qa-smoke добавлен в needs ради честного статуса: conclusion прогона тестов
    # берётся из него, а needs-context содержит только перечисленные джобы.
    needs: [qa-report, qa-smoke]
    runs-on: [self-hosted, linux, tamir-qa]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Скачивание отчёта
        uses: actions/download-artifact@v8
        with:
          name: allure-report
          path: .tmp/allure-report

      # SSH и sudo не нужны: runner работает под actions-runner, которому
      # принадлежит каталог /opt/qa-stack/reports (он же корень раздачи nginx),
      # а сам runner живёт на том же хосте, что и каталог отчётов.
      - name: Копирование отчёта в каталог отчётов
        run: |
          set -euo pipefail
          RUN_DIR="/opt/qa-stack/reports/${GITHUB_RUN_NUMBER}"
          LATEST_DIR="/opt/qa-stack/reports/latest"
          mkdir -p "${RUN_DIR}"
          rm -rf "${RUN_DIR:?}/"*
          cp -a .tmp/allure-report/. "${RUN_DIR}/"
          rm -rf "${LATEST_DIR}"
          mkdir -p "${LATEST_DIR}"
          cp -a .tmp/allure-report/. "${LATEST_DIR}/"

      - name: Обновление индекса прогонов runs.json
        run: |
          set -euo pipefail
          python3 qa/publish_runs_index.py \
            --reports-dir /opt/qa-stack/reports \
            --run-number "${GITHUB_RUN_NUMBER}" \
            --branch "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --status "${{ needs.qa-smoke.result }}"
