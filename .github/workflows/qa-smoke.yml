name: QA smoke (staging)

# Прод не трогается: тесты ходят только на staging-цели из docs/ENVIRONMENTS.md,
# а guard в qa/config.py не пустит запросы на tamir.rs / www.tamir.rs / api.tamir.rs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      headed:
        description: "Браузер с интерфейсом (актуально для e2e в M2)"
        type: boolean
        default: false
  schedule:
    # Ночной прогон на буднях
    - cron: "0 5 * * 1-5"

permissions:
  contents: read

# Один прогон на ветку/PR, но по очереди, а не отменой. Отменять прогон стенда
# нельзя: каждый из них публикует Allure-отчёт на qa.tamir.rs и пишет результаты
# в Kiwi TCMS. Практика показала обратное — при серии слияний Dependabot из
# шести пушей четыре прогона на main были отменены, и в отчётности появились
# дырки (PR #1-#10, 2026-11-23). Runner один (tamir-qa), поэтому очередь из
# прогонов по ~90 с безопаснее, чем потерянные прогоны.
concurrency:
  group: qa-smoke-${{ github.ref_name }}
  cancel-in-progress: false

# Версии действий берутся только теми, что уже отработали на этом раннере:
# major-тега у части экшенов нет (setup-uv@v10 → "unable to find version"), а
# обновляются они через Dependabot (.github/dependabot.yml), а не ручным
# переписыванием в main.

jobs:
  # Проверка для pull_request (в т.ч. Dependabot): только офлайн-unit-тесты, на
  # GitHub-hosted раннере, без сети, без секретов и без доступа к стенду. Это
  # тот статус-чек, который требует защита ветки перед auto-merge.
  qa-unit:
    name: Офлайн unit-проверка (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Установка uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Установка зависимостей и запуск unit-тестов
        run: |
          set -euo pipefail
          uv venv --python 3.12
          uv pip install -r requirements.txt
          .venv/bin/pytest -m unit --junitxml=.tmp/junit.xml

  qa-smoke:
    name: Прогон unit + smoke + api (self-hosted runner на staging)
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, tamir-qa]
    env:
      # Значения — только в GitHub Actions secrets; здесь лишь имена переменных.
      MEDUSA_PUBLISHABLE_API_KEY: ${{ secrets.MEDUSA_PUBLISHABLE_API_KEY }}
      # Каталог и результаты в Kiwi TCMS ведёт job qa-report (он же видит шаги
      # e2e-прогона), поэтому секретов TCMS здесь нет. Путь файла шагов фиксим
      # явно: его же указывают сидингу и синхронизации в qa-report.
      QA_STEPS_FILE: .tmp/steps.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Установка uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Установка зависимостей через uv
        run: |
          set -euo pipefail
          # .venv в каталоге прогона; интерпретатор — системный Python 3.12 стенда.
          uv venv --python 3.12
          uv pip install -r requirements.txt
          # Нужно для e2e в M2; в M1 браузерные тесты ещё не пишутся.
          .venv/bin/playwright install chromium

      # Один запуск pytest: addopts уже содержит --clean-alluredir, поэтому
      # несколько вызовов подряд стёрли бы результаты предыдущего.
      # `and not scenario`: сценарные тесты бегут в джобе qa-e2e, и здесь они не
      # нужны. Иначе один и тот же nodeid попадает в два allure-артефакта, а
      # Allure склеивает дубли по historyId и оставляет один из них — в отчёте
      # у теста может оказаться версия без шагов. Скобки важны: у `and` приоритет
      # выше, чем у `or`. Исключение `e2e` нужно потому, что браузерные тесты
      # каталога помечены и `catalog`, и `e2e`: их гоняет только job qa-e2e,
      # здесь им не место (лишняя нагрузка на стенд и двойные прогоны Playwright).
      - name: Запуск проверок
        run: |
          set -euo pipefail
          source .venv/bin/activate
          pytest -m "(unit or smoke or api or seo or catalog) and not (scenario or e2e)" --junitxml=.tmp/junit.xml ${{ inputs.headed && '--headed' || '' }}

      # МетADATA отчёта: из чего и где получен прогон. Значений секретов здесь нет.
      - name: Метаданные для Allure
        if: always()
        run: |
          set -euo pipefail
          cat > .tmp/allure-results/environment.properties <<'ENV'
          Wall=staging
          Web=https://test.tamir.rs
          Api=https://test-api.tamir.rs
          Reports=https://qa.tamir.rs
          TCMS=https://tcms.tamir.rs
          Mailpit=http://192.168.1.143:8025 (только из локальной сети)
          Runner=self-hosted tamir-qa
          ENV
          python3 - <<'PY'
          import json
          import os

          run_number = os.environ["GITHUB_RUN_NUMBER"]
          executor = {
              "name": "Tamir QA",
              "type": "github",
              "buildName": f"QA smoke #{run_number}",
              "buildUrl": (
                  f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              ),
              "reportUrl": f"https://qa.tamir.rs/{run_number}/",
          }
          with open(".tmp/allure-results/executor.json", "w", encoding="utf-8") as handle:
              json.dump(executor, handle, ensure_ascii=False, indent=2)
          PY

      - name: Загрузка Allure-результатов
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results
          path: .tmp/allure-results/
          if-no-files-found: warn

      # Файл шагов (его пишет pytest_sessionfinish, см. qa/steps.py) — единственный
      # источник текста тест-кейсов для Kiwi TCMS. Сам сидинг и перенос результатов
      # делает job qa-report: только там видны шаги обоих прогонов, включая e2e.
      # Файл подстрахован пустым словарём: если прогон не записал ни одного шага,
      # upload-artifact не создал бы артефакт, и скачивание в qa-report упало бы.
      - name: Подготовка файла шагов
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .tmp
          if [ ! -f .tmp/steps.json ]; then echo '{}' > .tmp/steps.json; fi

      - name: Загрузка шагов тест-кейсов
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: steps-smoke
          path: .tmp/steps.json
          if-no-files-found: warn

  # Браузерные e2e и сценарные проверки на стенде. Отдельный job рядом с
  # qa-smoke, а не шаг внутри него: прогоны долгие, результаты пишутся в свой
  # allure-каталог, а уборка тестовых данных в конце идёт даже при падении
  # тестов. На общем tamir-qa раннере job встаёт в очередь за smoke-прогоном
  # (concurrency не отменяет, а сериализует прогоны).
  qa-e2e:
    name: Прогон e2e + сценарии (self-hosted runner на staging)
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, tamir-qa]
    # Соседние job таймаут не фиксируют, но браузерному прогону на единственном
    # раннере своя граница нужна: зависший Chromium иначе блокирует всю очередь
    # прогонов до часового GitHub-лимита.
    timeout-minutes: 30
    env:
      # URL стенда — конфигурационные переменные репозитория (vars), ключи и
      # учётки — только в secrets; здесь лишь имена переменных.
      WEB_URL: ${{ vars.WEB_URL }}
      API_URL: ${{ vars.API_URL }}
      MEDUSA_PUBLISHABLE_API_KEY: ${{ secrets.MEDUSA_PUBLISHABLE_API_KEY }}
      MEDUSA_ADMIN_EMAIL: ${{ secrets.MEDUSA_ADMIN_EMAIL }}
      MEDUSA_ADMIN_PASSWORD: ${{ secrets.MEDUSA_ADMIN_PASSWORD }}
      # Mailpit (тестовая почта) доступен только из локальной сети стенда.
      MAILPIT_URL: ${{ secrets.MAILPIT_URL }}
      MAILPIT_USER: ${{ secrets.MAILPIT_USER }}
      MAILPIT_PASSWORD: ${{ secrets.MAILPIT_PASSWORD }}
      # Учётка постоянного тестового покупателя стенда: регистрацию через UI
      # закрывает Cloudflare Turnstile, поэтому аккаунт заведён один раз руками,
      # а значения живут только в secrets (см. docs/FINDINGS-frontend-backend.md).
      QA_WEB_EMAIL: ${{ secrets.QA_WEB_EMAIL }}
      QA_WEB_PASSWORD: ${{ secrets.QA_WEB_PASSWORD }}
      # Обход шлюза Cloudflare Turnstile, который продукт завёл только для тестовых
      # стендов (Tamir-Balkan PR #128): на стенде те же значения стоят в backend/.env,
      # а QA передаёт токен в теле заявки. Значение живёт только в secrets, и по нему
      # тесты понимают, доступен ли обход: без переменной они честно скипаются
      # (qa/http.py: captcha_bypass_token / with_captcha_bypass).
      QA_CAPTCHA_BYPASS_TOKEN: ${{ secrets.QA_CAPTCHA_BYPASS_TOKEN }}
      # Пути каталогов браузеров не задаём: Playwright сам кладёт их в
      # ~/.cache/ms-playwright раннера по ревизии сборки (chromium-<rev>), поэтому
      # версии не конфликтуют, а actions/checkout с clean: true каждый прогон
      # стирал бы каталог внутри workspace и Chromium качался бы заново.
      # Путь файла шагов фиксим явно: его же передают сидингу в qa-report.
      QA_STEPS_FILE: .tmp/steps.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Установка uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Установка зависимостей через uv
        run: |
          set -euo pipefail
          # .venv в каталоге прогона; интерпретатор — системный Python 3.12 стенда.
          uv venv --python 3.12
          uv pip install -r requirements.txt
          # Без --with-deps и без sudo: системные зависимости Chromium установлены
          # один раз на машине (runner ходит без пароля, apt в прогонах не
          # поднимается). Браузеры — в каталог из PLAYWRIGHT_BROWSERS_PATH.
          .venv/bin/playwright install chromium

      # Версия и наличие браузера видны в логе до запуска тестов: если install
      # не дотянул браузер, падение «browserType.launch» в первом же тесте
      # иначе выглядит как проблема стенда, а не прогона.
      - name: Проверка Playwright
        run: |
          set -euo pipefail
          .venv/bin/playwright --version

      # Снимаем голоса QA-покупателя, оставшиеся на QA-отзывах от прошлых прогонов.
      # Голос в продукте неизменяем (unvote-эндпоинта нет, в админке голоса не
      # удаляются), а повторный голос того же покупателя на тот отзыв — no-op:
      # на втором прогоне кнопки уже disabled и E2E-20 честно скипается. Поэтому
      # перед браузерным прогоном убираем ровно свои голоса: только покупателя
      # QA_WEB_EMAIL и только отзывов с меткой QA-FIXTURE — чужие отзывы и голоса
      # не трогаем. Шаг идёт на машине стенда (self-hosted runner: actions-runner
      # состоит в группе docker), прямого API для удаления голосов на стенде нет.
      # continue-on-error: сам skip он не снимает, но сбой клининга не должен
      # перекрашивать прогон — тесты честно скипнутся, если кнопки окажутся
      # disabled.
      - name: Снятие голосов QA-покупателя с QA-отзывов
        continue-on-error: true
        run: |
          set -euo pipefail
          # SQL идёт через stdin: psql интерполирует :'qa_email' только в тексте
          # из stdin/-f, а не в -c (проверено на стенде). Here-string, а не
          # heredoc: терминатор heredoc в YAML block scalar нельзя поставить
          # в колонку 0, не сломав сам workflow.
          printf '%s\n' \
            "delete from tamir_review_vote v" \
            "  using tamir_review r, customer c" \
            "  where v.review_id = r.id and v.customer_id = c.id" \
            "    and c.email = :'qa_email' and r.body like 'QA-FIXTURE%'" \
            "  returning v.id, v.review_id, v.value;" |
            docker exec -i tamir-staging-postgres-1 psql -U tamir_staging -d tamir_staging \
              -v qa_email="$QA_WEB_EMAIL"

      # Отдельный allure-каталог и отдельный вызов pytest: addopts содержит
      # --clean-alluredir, поэтому рядом с прогоном qa-smoke эти же маркеры
      # затирали бы чужие результаты.
      - name: Запуск e2e и сценарных проверок
        run: |
          set -euo pipefail
          source .venv/bin/activate
          pytest -m "e2e or scenario" --alluredir=.tmp/allure-e2e ${{ inputs.headed && '--headed' || '' }}

      - name: Загрузка e2e Allure-результатов
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results-e2e
          path: .tmp/allure-e2e/
          if-no-files-found: warn

      # Шаги e2e-сценариев идут в тот же каталог TCMS: qa-report склеивает их с
      # шагами smoke-прогона, и в тексте кейса оказываются настоящие шаги
      # сценария (оформление заказа → письмо в Mailpit), а не пересказ докстринга.
      - name: Подготовка файла шагов
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .tmp
          if [ ! -f .tmp/steps.json ]; then echo '{}' > .tmp/steps.json; fi

      - name: Загрузка шагов тест-кейсов
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: steps-e2e
          path: .tmp/steps.json
          if-no-files-found: warn

      # Уборка тестовых данных на staging: отмена QA-заказов и удаление
      # QA-покупателей (scripts/qa_cleanup.py). if: always() — чистим и после
      # упавших тестов; continue-on-error: сбой уборки не перекрашивает прогон
      # (остатки доочистит следующий ночной прогон), красным должен быть сбой
      # тестов, а не уборки.
      - name: Уборка тестовых данных на staging
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python scripts/qa_cleanup.py

  qa-report:
    name: Сборка Allure-отчёта (GitHub-hosted, там есть Java)
    # needs включает qa-e2e: без ожидания e2e-артефакта отчёт собирался бы без
    # браузерных прогонов, а каталог Kiwi TCMS — без e2e-кейсов и их результатов.
    needs: [qa-smoke, qa-e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Kiwi TCMS: сервисная учётка; её логин и пароль — в секретах репозитория.
      # TCMS доступен извне (Cloudflare Tunnel, Access не включён), поэтому
      # сидинг и перенос результатов живут в этом GitHub-hosted job вместе с
      # отчётом: здесь собраны артефакты обоих прогонов.
      TCMS_URL: ${{ secrets.TCMS_URL }}
      TCMS_USER: ${{ secrets.TCMS_USER }}
      TCMS_PASSWORD: ${{ secrets.TCMS_PASSWORD }}
    steps:
      - name: Java 17 (нужна для Allure CLI)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Установка Allure CLI
        run: npm i -g allure-commandline

      # Скрипты tcms_seed / tcms_sync_results импортируют пакет qa, поэтому здесь
      # тот же checkout и та же venv из requirements.txt, что в прогонных job
      # (браузеры Playwright ставить не нужно — только коллекция pytest).
      - name: Checkout
        uses: actions/checkout@v7

      - name: Установка uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Установка зависимостей через uv
        run: |
          set -euo pipefail
          uv venv --python 3.12
          uv pip install -r requirements.txt

      # merge-multiple: false — по каталогу на артефакт, поэтому результаты
      # smoke (.tmp/allure-by-job/allure-results) и e2e
      # (.tmp/allure-by-job/allure-results-e2e) остаются раздельными: в TCMS они
      # уходят двумя отдельными вызовами, и сбой e2e-синхронизации не съедает
      # результаты smoke-прогона.
      - name: Скачивание Allure-результатов
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results*
          path: .tmp/allure-by-job

      - name: Скачивание шагов тест-кейсов
        uses: actions/download-artifact@v8
        with:
          pattern: steps*
          path: .tmp/steps

      # Шаги обоих прогонов сливаются в один файл-словарь {nodeid: [шаги]}:
      # seeder и синхронизация читают один путь, а nodeid smoke- и e2e-тестов не
      # пересекаются, так что объединение — обычное слияние словарей.
      - name: Слияние шагов обоих прогонов
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import json
          import pathlib

          merged = {}
          for path in sorted(pathlib.Path(".tmp/steps").rglob("steps.json")):
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, ValueError) as exc:
                  print(f"шаги из {path} не прочитаны: {exc}")
                  continue
              if isinstance(data, dict):
                  merged.update(data)
              print(f"{path}: {len(data) if isinstance(data, dict) else 0} тестов")
          out = pathlib.Path(".tmp/steps.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(merged, ensure_ascii=False), encoding="utf-8")
          print(f"всего шагов для TCMS: {len(merged)}")
          PY

      # Отчёт же строится по объединённым результатам: у Allure result-файлы
      # именованы хэшами, коллизий между прогонами нет, environment.properties и
      # executor.json приходят из smoke-артефакта.
      - name: Объединение результатов для отчёта
        run: |
          set -euo pipefail
          mkdir -p .tmp/allure-results
          for src in .tmp/allure-by-job/*; do
            if [ -d "$src" ]; then cp -a "$src/." .tmp/allure-results/; fi
          done

      - name: Генерация отчёта
        run: allure generate .tmp/allure-results -o .tmp/allure-report --clean

      - name: Загрузка отчёта
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: .tmp/allure-report/

      # Каталог Kiwi TCMS приводится в соответствие коду на каждом прогоне main:
      # seeder идемпотентен и ключуется по pytest nodeid (поле `script`), а текст
      # кейса берётся из шагов, которые прогоны оставили в шаговых артефактах.
      # Порядок после «Генерации отчёта» не случайный: коллекция внутри сида
      # подхватывает addopts из pytest.ini (--alluredir + --clean-alluredir) и
      # стёрла бы .tmp/allure-results, если бы шла перед генерацией.
      # continue-on-error: недоступность TCMS не должна делать красным сам прогон —
      # сбой виден в логе шага, а тесты на стенде прошли.
      - name: Каталог тест-кейсов в Kiwi TCMS
        if: github.ref == 'refs/heads/main' && always()
        continue-on-error: true
        run: |
          set -euo pipefail
          .venv/bin/python scripts/tcms_seed.py --steps-file .tmp/steps.json

      # Результаты пишутся из Allure result-файлов (тот же источник, что и отчёт):
      # TestExecution.create/update + ссылка на отчёт этого прогона. Два вызова:
      # свой для smoke и свой для e2e — так браузерные кейсы попадают в TCMS даже
      # если smoke-часть прогона упала.
      - name: Результаты smoke в Kiwi TCMS
        if: github.ref == 'refs/heads/main' && always()
        continue-on-error: true
        run: |
          set -euo pipefail
          .venv/bin/python scripts/tcms_sync_results.py \
            --results .tmp/allure-by-job/allure-results \
            --steps-file .tmp/steps.json \
            --report-url "https://qa.tamir.rs/${GITHUB_RUN_NUMBER}/"

      - name: Результаты e2e в Kiwi TCMS
        if: github.ref == 'refs/heads/main' && always()
        continue-on-error: true
        run: |
          set -euo pipefail
          .venv/bin/python scripts/tcms_sync_results.py \
            --results .tmp/allure-by-job/allure-results-e2e \
            --steps-file .tmp/steps.json \
            --report-url "https://qa.tamir.rs/${GITHUB_RUN_NUMBER}/"

  # Проверки интеграции с Kiwi TCMS (маркер `tcms`, tests/api/test_tcms_api.py).
  # Тесты скипались в прогонах: секретов TCMS_* в qa-smoke/qa-e2e нет, а маркер
  # `tcms` не входил ни в одну маркер-экспрессию. Отдельный GitHub-hosted job:
  # TCMS доступен извне (Cloudflare Tunnel), тесты ходят только на tcms.tamir.rs
  # и стенда не касаются, поэтому self-hosted раннер и очередь за e2e им не
  # нужны. После qa-report намеренно: к этому моменту seeder и перенос
  # результатов в qa-report уже привели каталог в соответствие коду, и проверки
  # видят актуальное состояние. Свои Allure-результаты — отдельным артефактом:
  # в публикуемый отчёт они не сливаются (отчёт к этой точке уже собран и
  # опубликован), статус виден прямо во вкладке Actions.
  qa-tcms:
    name: Проверки интеграции Kiwi TCMS (GitHub-hosted)
    needs: [qa-report]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TCMS_URL: ${{ secrets.TCMS_URL }}
      TCMS_USER: ${{ secrets.TCMS_USER }}
      TCMS_PASSWORD: ${{ secrets.TCMS_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Установка uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Установка зависимостей и запуск проверок
        run: |
          set -euo pipefail
          uv venv --python 3.12
          uv pip install -r requirements.txt
          .venv/bin/pytest -m tcms --junitxml=.tmp/junit.xml

      - name: Загрузка Allure-результатов tcms
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results-tcms
          path: .tmp/allure-results/
          if-no-files-found: warn

  qa-publish:
    name: Публикация отчёта на qa.tamir.rs
    # qa-smoke добавлен в needs ради честного статуса: conclusion прогона тестов
    # берётся из него, а needs-context содержит только перечисленные джобы.
    # qa-e2e — чтобы публикация не уходила вперёд отчёта, в котором уже лежат
    # e2e-результаты.
    needs: [qa-report, qa-smoke, qa-e2e]
    runs-on: [self-hosted, linux, tamir-qa]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Скачивание отчёта
        uses: actions/download-artifact@v8
        with:
          name: allure-report
          path: .tmp/allure-report

      # SSH и sudo не нужны: runner работает под actions-runner, которому
      # принадлежит каталог /opt/qa-stack/reports (он же корень раздачи nginx),
      # а сам runner живёт на том же хосте, что и каталог отчётов.
      - name: Копирование отчёта в каталог отчётов
        run: |
          set -euo pipefail
          RUN_DIR="/opt/qa-stack/reports/${GITHUB_RUN_NUMBER}"
          LATEST_DIR="/opt/qa-stack/reports/latest"
          mkdir -p "${RUN_DIR}"
          rm -rf "${RUN_DIR:?}/"*
          cp -a .tmp/allure-report/. "${RUN_DIR}/"
          rm -rf "${LATEST_DIR}"
          mkdir -p "${LATEST_DIR}"
          cp -a .tmp/allure-report/. "${LATEST_DIR}/"

      - name: Обновление индекса прогонов runs.json
        run: |
          set -euo pipefail
          python3 qa/publish_runs_index.py \
            --reports-dir /opt/qa-stack/reports \
            --run-number "${GITHUB_RUN_NUMBER}" \
            --branch "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --status "${{ needs.qa-smoke.result }}"
